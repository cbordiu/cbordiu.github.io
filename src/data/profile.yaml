research:
  - title: Evolved massive stars and their circumstellar medium
    symbol: star
    keywords: [LBVs, "B[e] supergiants", astrochemistry]
    text: >-
      Luminous Blue Variables and their relatives lose a large share of their mass in brief, violent episodes.
      I trace the molecular gas and dust these episodes leave behind, from η Car and AG Car to the B[e]
      supergiant HD 87643, mainly with ALMA and IRAM, to reconstruct how and when that mass was lost.
    papers: [2022ApJ...939L..30B, 2026ApJ..1005L..34B, 2021MNRAS.500.5500B]
  - title: The Galactic radio sky with MeerKAT
    symbol: ring
    keywords: [SMGPS, radio rings, source catalogues]
    text: >-
      The SARAO MeerKAT Galactic Plane Survey resolves the Milky Way at arcsecond scales. I led its extended
      source catalogue and search the maps for unusual objects: ghostly thermal rings, compact radio
      shells, and the remnants of stellar mass loss that only appear at radio wavelengths.
    papers: [2025A&A...695A.144B, 2024A&A...690A..53B, 2025MNRAS.543.3708B]
  - title: Deep learning for radio astronomy
    symbol: network
    keywords: [unsupervised learning, source detection, diffusion models]
    text: >-
      Radio surveys now produce more sources than anyone can inspect by eye. I use machine learning to find
      structure in them: unsupervised views of the Galactic supernova remnant population, deep-learning source
      detection in radio maps, diffusion models that generate realistic synthetic images, and semi-supervised
      classification of evolved stars.
    papers: [2024A&A...690A.203B, 2024ITAI....5.6524S, 2024PASA...41...85R]
  - title: Simulating the SKA
    symbol: dish
    keywords: [skasim, SKA-Mid, SKA-Low]
    text: >-
      At IAA-CSIC I develop skasim, which produces synthetic SKA interferometric observations from a single
      configuration. It lets researchers test science cases against the real array assemblies before the
      telescope delivers data.
    papers: []
    links: [{ label: skasim on GitHub, url: "https://github.com/espsrc/espsrc_ska_simulator" }]

