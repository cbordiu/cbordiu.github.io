# *asterisks* mark accented phrases (shown in the accent colour).
about:
  - >-
    I came to astronomy through *engineering*. After a degree in telecommunication engineering and six
    years writing software at Telefónica, I did a PhD at the Universidad Complutense de Madrid and the
    Centro de Astrobiología on the *(sub)millimetre view of mass loss* in Luminous Blue Variables.
  - >-
    Since then my work has followed two threads. The first is *early-type evolved massive stars*, Luminous
    Blue Variables and B[e] supergiants, where I trace the *lifecycle of dust and molecules* in their
    outskirts, mostly with ALMA and single-dish telescopes. The second is the *Galactic radio sky*, as seen
    by MeerKAT and ASKAP, together with the software needed to make sense of it. I now work at IAA-CSIC on
    simulations for the *Square Kilometre Array*, within the AMIGA group and the Spanish SKA Regional Centre.
  - >-
    Running through both is an interest in how we analyse astronomical data: *deep learning* to find and
    classify sources in surveys too large to inspect by eye, and, more recently, *large language models* as
    tools for scientific research itself.

