software:
  - name: skasim
    url: https://github.com/espsrc/espsrc_ska_simulator
    text: Synthetic SKA observations. Wraps Karabo, OSKAR and WSClean behind one configuration model.
  - name: mufasa
    url: https://github.com/cbordiu/mufasa
    text: Multiwavelength Fast SED Assembler. Queries SIMBAD and VizieR, builds SEDs and overlays models.
  - name: caesar-rest
    url: https://ascl.net/2108.009
    text: Web service for the CAESAR source extractor, part of the CIRASA visual analytics platform (ascl:2108.009).
  - name: NEANIAS services
    url: https://www.neanias.eu
    text: Cloud visual-analytics and source-finding services for the European Open Science Cloud (H2020).

